<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which soil is your plate? | Kayla Bundy</title>
<meta name="description" content="Seven questions from the parable of the sower to see where your plate is right now. Free, about 2 minutes.">
<meta name="theme-color" content="#3D2E1E">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Kayla Bundy brand guide: Espresso #3D2E1E, Warm Cream #FAF8F4, Antique Gold #C9A96E, Soft Linen #F3EDE3. Playfair Display italic headlines, Jost Light body. --gold is a deeper shade of Antique Gold for small text on cream (readability). */
  --bg:#FAF8F4; --surface:#FFFEFB; --ink:#3D2E1E; --muted:#76664F; --rule:#E7DECF;
  --gold:#8A6B37; --gold-lt:#C9A96E; --night:#3D2E1E; --night-ink:#FAF8F4; --night-muted:#E4D8C4; --night-rule:#5A4733; --sand:#F3EDE3; --rust:#9C5B3B; --err:#A33B2E;
  --serif:"Playfair Display", Georgia, "Times New Roman", serif;
  --sans:"Jost", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{ --bg:#0E0D0B; --surface:#1A1814; --ink:#F2EBDD; --muted:#A79C88; --rule:#3A342B; --gold:#D8B66E; --sand:#24211C; --err:#E07A6A; color-scheme: dark; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans); font-weight:300; font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--gold); outline-offset:3px}
.wrap{max-width:560px; margin:0 auto; padding:0 22px}

/* dark screens: intro, results hero, offers */
.dark{background:var(--night); color:var(--night-ink)}
.intro{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column}
.intro .wrap{flex:1; display:flex; flex-direction:column; justify-content:center; padding-top:28px; padding-bottom:36px}
.logo{width:min(250px,62vw); display:block; margin:0 auto 26px}
.wordmark{font-family:var(--serif); font-size:15px; letter-spacing:.18em; text-transform:uppercase; text-align:center; color:var(--gold-lt); margin:0 0 26px}
.intro h1{font-family:var(--serif); font-style:italic; font-weight:400; font-size:clamp(38px,10.5vw,54px); line-height:1.02; margin:0 0 12px; text-align:center; letter-spacing:-.01em}
.intro .sub{font-family:var(--serif); font-style:italic; font-size:20px; line-height:1.35; color:var(--gold-lt); text-align:center; margin:0 auto 22px; max-width:24em}
.intro .lede{font-weight:300; font-size:16px; color:var(--night-muted); text-align:center; margin:0 auto 26px; max-width:30em}
.intro .meta{display:flex; justify-content:center; gap:18px; font-size:13px; color:var(--night-muted); margin-bottom:28px; flex-wrap:wrap}
.intro .note{font-size:13px; font-weight:300; color:var(--night-muted); opacity:.8; text-align:center; margin:22px auto 0; max-width:30em}
.intro .switch{text-align:center; margin-top:18px; font-size:14px}
.intro .switch a{color:var(--gold-lt)}

.btn{display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 30px; border-radius:30px; border:0; background:var(--gold-lt); color:var(--night); font-weight:500; font-size:16px; letter-spacing:.03em; cursor:pointer; text-decoration:none; width:100%}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--rule)}
.dark .btn.ghost{color:var(--night-ink); border-color:var(--night-rule)}
.intro .btn{max-width:340px; margin:0 auto}

/* question screens */
.top{position:sticky; top:0; z-index:5; background:var(--bg); padding:14px 0 10px}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:13px; color:var(--muted)}
.back{background:none; border:0; padding:8px 0; cursor:pointer; color:var(--muted)}
.track{height:3px; background:var(--rule); border-radius:2px; overflow:hidden; margin-top:10px}
.fill{height:100%; background:var(--gold); width:0; transition:width .35s ease}
.q{padding-top:26px; padding-bottom:40px}
.q .part{font-size:13px; color:var(--gold); margin:0 0 10px; font-weight:500}
.q h2{font-family:var(--serif); font-style:italic; font-weight:400; font-size:clamp(28px,7.4vw,36px); line-height:1.12; margin:0 0 10px}
.q .hint{color:var(--muted); font-size:15px; margin:0 0 24px}
.opts{display:grid; gap:10px}
.opt{display:block; width:100%; text-align:left; font-weight:400; background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:16px 18px; font-size:16px; line-height:1.45; cursor:pointer; transition:border-color .15s, background .15s}
@media (hover:hover){.opt:hover{border-color:var(--gold)}}
.opt[aria-pressed="true"]{border-color:var(--gold); background:var(--sand); box-shadow:inset 3px 0 0 var(--gold)}
.scale{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
.scale .opt{text-align:center; padding:16px 0; font-family:var(--serif); font-size:22px; font-weight:600}
.scale.ten .opt{padding:13px 0; font-size:20px}
.ends{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-top:10px}
.grid{display:grid; gap:20px}
.grid-row .label{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px}
.grid-row b{font-family:var(--serif); font-size:21px; font-weight:600}
.grid-row span{font-size:13px; color:var(--muted)}
.grid-row .scale .opt{padding:12px 0; font-size:19px}
.next{margin-top:28px}

/* gate */
.gate{padding-top:30px; padding-bottom:44px}
.gate .ready{font-size:13px; color:var(--gold); font-weight:500; margin:0 0 10px}
.gate h2{font-family:var(--serif); font-style:italic; font-weight:400; font-size:clamp(32px,9vw,44px); line-height:1.08; margin:0 0 10px}
.gate .body{color:var(--muted); margin:0 0 26px}
.field{margin-bottom:16px}
.field label{display:block; font-size:14px; font-weight:400; color:var(--muted); margin-bottom:6px}
.field label small{color:var(--gold)}
.field .in{display:flex; align-items:center; background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:0 16px; min-height:54px}
.field .in:focus-within{border-color:var(--gold)}
.field .in span{color:var(--muted); margin-right:4px}
.field input,.field select{flex:1; border:0; background:transparent; min-height:52px; font-size:17px; outline:none; min-width:0; color:var(--ink)}
.field .hint{font-size:13px; color:var(--muted); margin:6px 0 0}
.field.bad .in{border-color:var(--err)}
.field .err{font-size:13px; color:var(--err); margin:6px 0 0; display:none}
.field.bad .err{display:block}
.consent{font-size:13px; color:var(--muted); margin:6px 0 18px}
.gate .note{font-size:13px; color:var(--muted); text-align:center; margin:14px 0 0}

/* results */
.res-hero{padding:44px 0 40px}
.res-hero .k{color:var(--gold-lt); font-size:14px; margin:0 0 10px}
.res-hero h1{font-family:var(--serif); font-style:italic; font-weight:400; font-size:clamp(40px,11vw,58px); line-height:1; margin:0 0 14px}
.res-hero .tag{font-family:var(--serif); font-style:italic; font-size:21px; line-height:1.35; color:var(--gold-lt); margin:0 0 18px}
.res-hero p{font-weight:300; color:var(--night-muted); margin:0 0 12px}
.res-hero .foot{border-top:1px solid var(--night-rule); margin-top:22px; padding-top:18px}
.res-hero .foot b{display:block; color:var(--gold-lt); font-weight:500; font-size:14px; margin-bottom:4px}
.res-hero .hello{font-size:14px; color:var(--night-muted); margin:0 0 6px}
section.block{padding:38px 0 6px}
section.block h3{font-family:var(--serif); font-style:italic; font-weight:500; font-size:28px; line-height:1.15; margin:0 0 6px}
section.block .lead{color:var(--muted); margin:0 0 22px}
.video{position:relative; padding-top:56.25%; border-radius:14px; overflow:hidden; background:#000}
.video iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.meter{margin-bottom:20px}
.meter .row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px}
.meter .row b{font-family:var(--serif); font-size:20px; font-weight:600}
.meter .row span{font-size:14px; color:var(--muted)}
.bar{height:10px; background:var(--sand); border-radius:6px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--gold); border-radius:6px; width:0; transition:width .9s cubic-bezier(.2,.7,.2,1)}
.bar.low i{background:var(--rust)}
.meter p{margin:7px 0 0; font-size:15px; color:var(--muted)}
.actions{list-style:none; padding:0; margin:0; counter-reset:a}
.actions li{counter-increment:a; position:relative; padding:20px 0 20px 46px; border-top:1px solid var(--rule)}
.actions li:last-child{border-bottom:1px solid var(--rule)}
.actions li::before{content:counter(a); position:absolute; left:0; top:17px; font-family:var(--serif); font-size:32px; line-height:1; color:var(--gold)}
.actions .why{display:block; font-size:13px; color:var(--gold); margin-bottom:4px; font-weight:500}
.actions .do{font-family:var(--serif); font-size:20px; line-height:1.35}
.quote{font-family:var(--serif); font-style:italic; font-size:21px; line-height:1.4; border-left:3px solid var(--gold); padding:4px 0 4px 18px; margin:30px 0 0}
section.block .k{color:var(--gold); font-size:12px; letter-spacing:.14em; text-transform:uppercase; margin:0 0 6px; font-weight:500}
.pdf{background:var(--sand); border-radius:14px; padding:20px; margin-top:6px}
.pdf b{font-family:var(--serif); font-style:italic; font-size:21px; font-weight:500; display:block; line-height:1.3}
.pdf p{margin:4px 0 14px; color:var(--muted); font-size:15px}
.notready{margin:16px 0 0; font-size:15px} .notready a{color:var(--night-muted); text-decoration:underline; text-underline-offset:3px}
.more{margin:10px 0 0; font-size:13.5px; color:var(--night-muted)} .more a{color:var(--gold-lt); text-underline-offset:3px}
.soon{font-size:13px; color:var(--night-muted); margin:8px 0 0}
.btn[disabled]{opacity:.55; cursor:default}
.care{background:var(--sand); border-radius:14px; padding:18px 20px; font-size:15px; color:var(--muted); margin:30px 0 0}
.cta{margin-top:42px; padding:40px 0 48px}
.kban{position:relative;height:42vh;min-height:280px;max-height:440px;overflow:hidden}
.kban .kph{position:absolute;inset:0;overflow:hidden;border-radius:inherit}.kban .kph img{width:100%;height:100%;object-fit:cover;animation:kdrift 16s ease-in-out infinite alternate}
.kban:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(61,46,30,0) 45%,var(--night))}
@keyframes kdrift{from{transform:scale(1.03)}to{transform:scale(1.1) translate(-6px,-4px)}}
.intro .wrap{justify-content:flex-start}
.intro .kban + .wrap{margin-top:-70px;position:relative;padding-top:0}
.kq{margin:16px 0 0;aspect-ratio:3/2;max-width:440px;border-radius:18px;overflow:hidden;box-shadow:0 12px 30px rgba(61,46,30,.14)}
.kq img{width:100%;height:100%;object-fit:cover;animation:kfade .6s ease}
@keyframes kfade{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.kgate{position:relative;margin:4px 0 22px;border-radius:20px;overflow:hidden;aspect-ratio:3/2;max-width:440px;width:100%;box-shadow:0 16px 40px rgba(61,46,30,.16)}
.kgate img{width:100%;height:100%;object-fit:cover}
.kgate:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(30,22,14,.7),rgba(30,22,14,0) 55%)}
.kgate figcaption{position:absolute;z-index:2;left:18px;right:18px;bottom:14px;color:#fff;font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.3}
.kres{margin:8px 0 6px;border-radius:20px;overflow:hidden;aspect-ratio:4/5;max-height:520px;box-shadow:0 16px 40px rgba(61,46,30,.14)}
.kres img{width:100%;height:100%;object-fit:cover}
.knote{position:relative;margin:-40px -22px 34px;min-height:620px;overflow:hidden;display:flex;align-items:flex-end}
.knote .kn-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kdrift 18s ease-in-out infinite alternate}
.knote:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--night) 6%,rgba(61,46,30,.88) 38%,rgba(61,46,30,.15) 68%,rgba(61,46,30,.35))}
.knote figcaption{position:relative;z-index:2;padding:0 26px 30px}
.knote .k{margin:0 0 10px;color:var(--gold-lt)}
.knote .kb{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.4;color:var(--night-ink);margin:0 0 14px;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.knote .ks{font-family:var(--serif);font-style:italic;font-size:30px;color:var(--gold-lt);margin:0}
.knote .ks:before{content:"";display:block;width:44px;height:1px;background:var(--gold-lt);margin:0 0 12px}
@media (min-width:720px){.knote{margin:-40px 0 34px;border-radius:24px;min-height:680px}}
@media (prefers-reduced-motion:reduce){.kban .kph img,.kq img,.knote .kn-img{animation:none}}
.cta h3{font-family:var(--serif); font-style:italic; font-weight:400; font-size:32px; line-height:1.1; margin:0 0 12px}
.cta p{font-weight:300; color:var(--night-muted); margin:0 0 24px}
.cta .step{border-top:1px solid var(--night-rule); padding:20px 0}
.cta .step b{font-family:var(--serif); font-size:22px; font-weight:500; display:block}
.cta .step span{display:block; font-weight:300; font-size:15px; color:var(--night-muted); margin:4px 0 14px}
.cta .code{display:inline-block; font-family:var(--serif); font-size:22px; letter-spacing:.08em; color:var(--gold-lt); border:1px dashed var(--night-rule); padding:6px 14px; border-radius:8px; margin-bottom:14px}
.tools{display:grid; gap:10px; margin-top:26px}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){ .fill,.bar i{transition:none} }
/*KED*/
/* ===== Sales page design language (cream, editorial, gentle motion) ===== */
.intro.ed{background:var(--bg); color:var(--ink); min-height:auto}
.intro.ed .kban{width:calc(100% - 32px); max-width:420px; aspect-ratio:3/2; height:auto; min-height:0; max-height:none; margin:14px auto 0; border-radius:22px; box-shadow:0 22px 50px rgba(61,46,30,.18)}
@media (min-width:720px){.intro.ed .kban{width:100%; max-width:400px; margin:24px auto 0}}
.intro.ed .kban:after{display:none}
.intro.ed .wrap{margin-top:0; padding-top:24px; justify-content:flex-start}
.intro.ed .k{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); font-weight:500; margin:0 0 8px}
.intro.ed .k,.intro.ed h1,.intro.ed .sub,.intro.ed .lede,.intro.ed .note{text-align:center; margin-left:auto; margin-right:auto}
.intro.ed .rule{width:64px; margin:4px auto 20px; transform-origin:center}
.intro.ed h1{font-size:clamp(36px,10vw,58px); line-height:1.04; margin-bottom:10px}
.intro.ed .sub{margin-bottom:14px}
.intro.ed .lede{font-size:15px; margin-bottom:18px}
.intro.ed .meta{margin-bottom:18px}
.intro.ed .sub{color:var(--gold)}
.intro.ed .lede,.intro.ed .note,.intro.ed .meta{color:var(--muted)}
.intro.ed .meta{justify-content:center}
.intro.ed .btn{margin:0 auto; max-width:340px}
.rule{height:1px; background:var(--gold-lt); margin:6px 0 22px; transform-origin:left}
.line{display:block; overflow:hidden; padding-bottom:.06em}.line>span{display:block}
.res-hero.ed{background:var(--bg); color:var(--ink)}
.res-hero.ed .k{color:var(--gold); font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:500}
.res-hero.ed p{color:var(--muted)}
.res-hero.ed .hello{color:var(--muted)}
.res-hero.ed .verse{color:var(--muted)}.res-hero.ed .verse b{color:var(--gold)}
.res-hero.ed .foot{border-color:var(--rule)}
.res-hero.ed .scene{box-shadow:0 22px 50px rgba(61,46,30,.22)}
.proof{background:var(--sand); padding:44px 0 40px; margin-top:30px}
.proof h3{font-family:var(--serif); font-style:italic; font-weight:400; font-size:30px; line-height:1.15; margin:0 0 4px}
.proof .k{color:var(--gold); font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:500; margin:0 0 6px}
.proof .marq{overflow:hidden; padding:8px 0; -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent); mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.proof .ptrack{display:flex; gap:14px; width:max-content; animation:mq 70s linear infinite}
.proof .ptrack.r{animation-direction:reverse; animation-duration:80s}
.proof .marq:hover .ptrack{animation-play-state:paused}
.mc{margin:0; width:270px; background:var(--surface); border:1px solid var(--rule); border-radius:20px; padding:18px; box-shadow:0 10px 26px rgba(61,46,30,.08); display:flex; flex-direction:column; justify-content:space-between}
.mc blockquote{margin:0; font-family:var(--serif); font-style:italic; font-size:18px; line-height:1.4}
.mc figcaption{margin-top:12px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold)}
.pnote{text-align:center; font-size:13px; color:var(--muted); margin:10px 0 0}
.rib{overflow:hidden; margin-top:24px; -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent); mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.rtrack{display:flex; gap:14px; width:max-content; animation:mq 50s linear infinite}
.rtrack img{width:96px; height:96px; border-radius:50%; object-fit:cover; border:3px solid #fff; box-shadow:0 6px 16px rgba(61,46,30,.18)}
.ribcap{text-align:center; font-size:12px; color:var(--muted); letter-spacing:.16em; text-transform:uppercase; margin:12px 0 0}
@keyframes mq{to{transform:translateX(-50%)}}
.proof + .cta{margin-top:0}
.kres,.kq,.kgate{box-shadow:0 22px 50px rgba(61,46,30,.16)}
/* reveals */
.rv{opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1; transform:none}
h1 .line>span{transform:translateY(105%); transition:transform .8s cubic-bezier(.2,.7,.2,1)}
h1.in .line>span{transform:none}
h1 .line:nth-child(2)>span{transition-delay:.08s}
.rule{transform:scaleX(0); transition:transform 1.2s cubic-bezier(.65,0,.2,1) .2s}.rule.in{transform:scaleX(1)}
@media (prefers-reduced-motion:reduce){ .rv,h1 .line>span,.rule{opacity:1!important; transform:none!important; transition:none!important} .proof .ptrack,.rtrack{animation:none} .proof .marq,.rib{overflow-x:auto} }
.intro.ed h1,.intro.ed .sub,.intro.ed .lede{animation:none}
.intro.ed .kban + .wrap{margin-top:0; padding-top:24px}
.intro.ed .kban{position:relative}
.intro .sower.under{width:100px; margin:-4px auto 30px}
.intro .sower.under .fall{animation-name:seedFallS; width:9px}
.intro .sower.under .fall.f2{width:8px}.intro .sower.under .fall.f3{width:7px}
@keyframes seedFallS{0%{opacity:0; transform:translateY(0) rotate(0)} 15%{opacity:1} 70%{opacity:1} 100%{opacity:0; transform:translateY(46px) rotate(70deg)}}
.intro.ed .kban + .wrap{padding-top:12px}
@media (min-width:900px){
 .intro.ed{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:56px; align-items:center; max-width:1120px; margin:0 auto; padding:40px 40px; min-height:100vh; min-height:100dvh}
 .intro.ed .kban{max-width:none; width:100%; aspect-ratio:4/5; max-height:82vh; margin:0}
 .intro.ed .kban + .wrap{padding:0; max-width:none}
 .kq{max-width:320px}
 .kgate{max-width:360px}
}
/*KEDEND*/
/* ---------- Parable art and motion (optional: only used when config sets C.art / pattern.scene) ---------- */
.sower{position:relative; width:min(230px,58vw); margin:0 auto 10px; aspect-ratio:1000/1050}
.sower .hand{width:100%; display:block; opacity:0; transform:translate(-14px,-10px) rotate(-4deg); animation:handIn 1.4s .15s ease-out forwards}
.sower .fall{position:absolute; width:14px; left:70%; top:62%; opacity:0; animation:seedFall 2.6s ease-in infinite}
.sower .fall.f2{left:76%; animation-delay:.9s; width:12px} .sower .fall.f3{left:67%; animation-delay:1.7s; width:11px}
@keyframes handIn{to{opacity:1; transform:none}}

<meta property="og:title" content="Which soil is your plate? | Kayla Bundy">
<meta property="og:description" content="A 2-minute quiz from Kayla Bundy, The Biblical Nutritionist. Find out where your plate is right now, and get your free Biblical Eating Foundation Guide.">
<meta property="og:image" content="https://quiz.kaylabundy.com/.netlify/functions/og-image">

<meta property="og:type" content="website">

</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script>
/* =====================================================================
   ENGINE. Reads window.ICA. Do not put coach content in here.
   ===================================================================== */
const C = window.ICA;
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LEAD_KEY = `ica-lead-${C.coach.slug}`;
/* Source tracking: links shared as ?src=youtube (or utm_source) are remembered so every lead shows where it came from. */
const SRC_KEY = `ica-src-${C.coach.slug}`;
/* early access link (?access=early): remembered so the sales page shows the early price after the quiz */
try { if (new URLSearchParams(location.search).get("access") === "early") localStorage.setItem("ft-access", "early"); } catch(e){}
(() => { const q = new URLSearchParams(location.search); const src = q.get("src") || q.get("utm_source"); if (src) try { localStorage.setItem(SRC_KEY, JSON.stringify({ src: src.slice(0,60), campaign: (q.get("utm_campaign")||"").slice(0,60) })); } catch(e){} })();
const source = () => { try { return JSON.parse(localStorage.getItem(SRC_KEY) || "null") || {}; } catch(e){ return {}; } };

/* ---------- routing: #assessment-id ---------- */
/* Which assessment: /scorecard or /heart-over-head (clean links), or #scorecard as a fallback. Anything else = default. */
function currentId(){
  const path = location.pathname.replace(/^\/+|\/+$/g, "").split("/")[0];
  const h = location.hash.replace("#","").trim();
  if (C.assessments[path]) return path;
  if (C.assessments[h]) return h;
  return C.defaultAssessment;
}
let A, KEY, state;
function load(){
  A = C.assessments[currentId()];
  KEY = `ica-${C.coach.slug}-${A.id}-v1`;
  state = { step:-1, answers:{}, submitted:false, branch:null };
  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.answers) state = s; } catch(e){}
  document.title = `${A.title} | ${C.coach.name}`;
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} };
const lead = () => { try { return JSON.parse(localStorage.getItem(LEAD_KEY) || "null") || {}; } catch(e){ return {}; } };
const saveLead = l => { try { localStorage.setItem(LEAD_KEY, JSON.stringify(l)); } catch(e){} };
window.addEventListener("hashchange", () => { load(); render(); });

/* Visible questions: a question with `branch` only shows when the person's branch pick matches. Each keeps its original index (q.i) for answers. */
const Q = () => A.questions.map((q,i) => Object.assign({ i }, q)).filter(q => !q.branch || q.branch === state.branch);
const N = () => Q().length;           // steps: -1 intro, 0..N-1 questions, N gate, N+1 results
const countEstimate = () => { const first = A.questions.find(q => q.type === "branch"); const b = state.branch || (first && first.opts[0][1]); return A.questions.filter(q => !q.branch || q.branch === b).length; };

/* ---------- funnel tracking (XPLR base layer: anonymous step names only) ---------- */
const T = window.XPLRTrack ? XPLRTrack.init({ site: C.coach.slug, repeat: ["guide_click","cta_click"] }) : { step(){}, scan(){}, whenSeen(){}, watchVideo(){} };
T.step("land");
function render(){
  window.scrollTo(0,0);
  if (state.step > 0 && state.step <= N()) T.step("q", { n: state.step });
  if (state.step < 0) return renderIntro();
  if (state.step < N()) return renderQuestion();
  if (state.step === N()) return renderGate();
  renderResults();
}

/* ---------- parable art helpers ---------- */
const ART = C.art || {};
function furrowHtml(done, total){
  const seeds = Array.from({length:done}, (_,k) => `<img class="seed${k === done-1 ? " new" : ""}" style="left:${((k+.5)/total*100).toFixed(1)}%" src="${esc(ART.seed)}" alt="">`).join("");
  return `<div class="furrow" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><img class="soil" src="${esc(ART.furrow)}" alt="">${seeds}</div>`;
}
function sceneHtml(P){
  const sc = P.scene; if (!sc) return "";
  return `<div class="scene" id="scene" aria-hidden="true"><img class="base" src="${esc(sc.base)}" alt="">` +
    (sc.layers||[]).map(l => `<img class="l ${esc(l.cls)}" src="${esc(l.src)}" alt="">`).join("") + `</div>` +
    (sc.verse ? `<p class="verse">${esc(sc.verse)}<b>${esc(sc.ref||"")}</b></p>` : "");
}
/* Start a scene's motion once its images have loaded, so nothing pops in half-drawn. */
function startScene(){
  const el = document.getElementById("scene"); if (!el) return;
  const imgs = [...el.querySelectorAll("img")];
  Promise.race([Promise.all(imgs.map(i => i.decode ? i.decode().catch(()=>{}) : Promise.resolve())), new Promise(r => setTimeout(r, 2500))])
    .then(() => el.classList.add("go"));
}
/* Warm the browser cache with her scene while she fills in the form. */
function preloadScene(){
  try { const P = A.patterns[score().pattern]; const sc = P && P.scene; if (!sc) return;
    [sc.base, ...(sc.layers||[]).map(l => l.src)].forEach(u => { const im = new Image(); im.src = u; }); } catch(e){}
}

/* ---------- intro ---------- */
function logoHtml(){
  return C.coach.logo
    ? `<img class="logo" src="${esc(C.coach.logo)}" alt="${esc(C.coach.name)}" onerror="this.outerHTML='<p class=wordmark>${esc(C.coach.name)}</p>'">`
    : `<p class="wordmark">${esc(C.coach.name)}</p>`;
}
/* ---------- Kayla's photos ---------- */
const PH = C.photos || {};
function kimg(p, cls, alt, eager){ if (!p) return "";
  const [n, pos] = p, base = "assets/kayla/q-" + n;
  return `<img class="${cls}" src="${base}-800.webp" srcset="${base}-800.webp 800w, ${base}-1200.webp 1200w" sizes="(min-width:720px) 680px, 100vw" style="object-position:${pos || "50% 35%"}" alt="${esc(alt || "Kayla Bundy")}" ${eager ? 'fetchpriority="high"' : 'loading="lazy"'}>`; }
/* Split a headline into two lines that rise in, like the sales page. */
function lines(t){ const w = String(t).split(" "); if (w.length < 3) return `<span class="line"><span>${esc(t)}</span></span>`;
  const h = Math.ceil(w.length / 2); return [w.slice(0,h).join(" "), w.slice(h).join(" ")].map(x => `<span class="line"><span>${esc(x)}</span></span>`).join(""); }
function proofHtml(){ const p = PH.proof; if (!p) return "";
  const card = ([q,c]) => `<figure class="mc"><blockquote>\u201c${esc(q)}\u201d</blockquote><figcaption>${esc(c)}</figcaption></figure>`;
  const rib = (p.ribbon||[]).map(n => `<img src="assets/kayla/${n}-480.webp" alt="" loading="lazy">`).join("");
  return `<section class="proof">
    <div class="wrap"><p class="k rv">${esc(p.kicker)}</p><h3 class="rv">${esc(p.heading)}</h3><div class="rule"></div></div>
    <div class="marq"><div class="ptrack">${p.row1.concat(p.row1).map(card).join("")}</div></div>
    <div class="marq"><div class="ptrack r">${p.row2.concat(p.row2).map(card).join("")}</div></div>
    <div class="wrap"><p class="pnote">${esc(p.note)}</p></div>
    ${rib ? `<div class="rib" aria-hidden="true"><div class="rtrack">${rib}${rib}</div></div><p class="ribcap">${esc(p.ribbonCap||"")}</p>` : ""}
  </section>`; }
/* Gentle scroll reveals, same motion as the sales page. */
function motion(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ app.querySelectorAll(".rv,.line,.rule,h1").forEach(e => e.classList.add("in")); return; }
  app.querySelectorAll("section.block, .kres, .kq, .kgate, .proof .marq, .knote figcaption").forEach(e => e.classList.add("rv"));
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold:.12 });
  app.querySelectorAll(".rv, .rule, h1").forEach(e => io.observe(e));
}
function hostNote(){ const h = PH.note; if (!h) return "";
  return `<figure class="knote">${kimg(h.photo, "kn-img", "Kayla Bundy")}<figcaption><p class="k">${esc(h.kicker)}</p><p class="kb">${esc(h.body)}</p><p class="ks">${esc(h.sign)}</p></figcaption></figure>`; }
function hand_html(){ return ART.hand ? `<div class="sower under" aria-hidden="true"><img class="hand" src="${esc(ART.hand)}" alt="">${ART.seed ? [1,2,3].map(k => `<img class="fall f${k}" src="${esc(ART.seed)}" alt="">`).join("") : ""}</div>` : ""; }
function renderIntro(){
  const resume = Object.keys(state.answers).length > 0 && !state.submitted;
  const others = C.linkBetweenAssessments ? Object.values(C.assessments).filter(x => x.id !== A.id) : [];
  app.innerHTML = `
  <div class="intro${PH.intro ? " ed" : " dark"}">${PH.intro ? `<div class="kban"><div class="kph">${kimg(PH.intro, "", "Kayla Bundy smiling in her kitchen", true)}</div></div>` : ""}<div class="wrap">
    ${PH.intro ? hand_html() + `<p class="k rv">A 2-minute quiz from Kayla Bundy</p>` : ""}
    ${PH.intro ? "" : ART.hand ? `<div class="sower" aria-hidden="true"><img class="hand" src="${esc(ART.hand)}" alt="">${ART.seed ? [1,2,3].map(k => `<img class="fall f${k}" src="${esc(ART.seed)}" alt="">`).join("") : ""}</div>` : logoHtml()}
    <h1 aria-label="${esc(A.title)}">${lines(A.title)}</h1>
    <p class="sub rv">${esc(A.subtitle)}</p>
    ${PH.intro ? `<div class="rule"></div>` : ""}
    ${A.introPain ? `<p class="lede rv">${esc(A.introPain)}</p>` : `<p class="lede rv">${esc(A.lede)}</p>`}
    ${A.introGets ? `<div class="gets rv"><p class="gk">${esc(A.introGetsLabel||"")}</p><ul>${A.introGets.map(g => `<li>${esc(g)}</li>`).join("")}</ul></div>` : ""}
    <button class="btn pulse" id="start">${resume ? "Pick up where you left off" : esc(A.startButton || "Start")}</button>
    <div class="meta after"><span>${countEstimate()} questions</span><span>${esc(A.minutes)}</span><span>Private to you</span></div>
    ${resume ? `<button class="btn ghost" id="restart" style="max-width:340px;margin:10px auto 0">Start over</button>` : ""}
    <p class="note">${esc(A.privacy)} <a href="/terms/" target="_blank" rel="noopener">Terms &amp; Privacy</a></p>
    ${others.length ? `<p class="switch">${others.map(o => `<a href="/${o.id}">Or take ${esc(o.title)}</a>`).join(" ")}</p>` : ""}
  </div></div>`;
  motion();
  document.getElementById("start").onclick = () => { T.step("start", null, true); state.step = resume ? firstUnanswered() : 0; if(!resume){ state.answers={}; state.submitted=false; state.branch=null; state.order=null; } save(); render(); };
  const r = document.getElementById("restart");
  if (r) r.onclick = () => { state = { step:0, answers:{}, submitted:false, branch:null, order:null }; save(); render(); };
}
function firstUnanswered(){ for (let i=0;i<N();i++) if (!answered(i)) return i; return N(); }
function answered(i){
  const q = Q()[i], a = state.answers[q.i];
  if (q.type === "grid") return !!a && q.keys.every(k => a[k]);
  return a !== undefined;
}

/* ---------- questions ---------- */
function scaleHtml(q, cur, extra){
  const max = q.max || 5, vals = Array.from({length:max}, (_,k)=>k+1);
  return `<div class="scale ${max>5?"ten":""}" role="group" aria-label="1 to ${max}">` +
    vals.map(v => `<button class="opt" ${extra||""} data-v="${v}" aria-pressed="${cur===v}">${v}</button>`).join("") + `</div>`;
}
/* Shuffled answer order (assessment option `shuffle: true`). Made once per attempt and saved, so Back and resume keep the same order. Answers always store the original option index. */
function optOrder(q){
  const idx = q.opts.map((_,k) => k);
  if (!A.shuffle || q.type === "branch") return idx;
  state.order = state.order || {};
  if (!state.order[q.i] || state.order[q.i].length !== idx.length){
    for (let k = idx.length - 1; k > 0; k--){ const j = Math.floor(Math.random() * (k + 1)); [idx[k], idx[j]] = [idx[j], idx[k]]; }
    state.order[q.i] = idx; save();
  }
  return state.order[q.i];
}

/* ---------- scoring ---------- */
function score(){
  const sums = {}, picks = {};
  Object.keys(A.patterns).forEach(k => picks[k] = 0);
  Object.keys(A.dimensions).forEach(k => sums[k] = []);
  const push = (k, v, max) => { if (sums[k]) sums[k].push(Math.round((v-1)/(max-1)*100)); };
  Q().forEach(q => {
    const a = state.answers[q.i]; if (a === undefined) return;
    if (q.type === "scenario") picks[q.opts[a][1]]++;
    if (q.type === "scale"){ const max = q.max||5; push(q.key, a, max); if (q.also) push(q.also.key, q.also.reverse ? (max+1-a) : a, max); }
    if (q.type === "grid") Object.entries(a).forEach(([k,v]) => push(k, v, q.max||5));
  });
  const dims = {};
  Object.entries(sums).forEach(([k,arr]) => dims[k] = arr.length ? Math.round(arr.reduce((x,y)=>x+y,0)/arr.length) : null);
  const groups = A.groups || [];
  const lowGroup = groups.length ? (groups.find(g => g.lowestFrom) || groups[0]).id : null;
  const order = A.lowestOrder || Object.keys(dims);
  const ranked = Object.entries(dims).filter(([k,v]) => A.dimensions[k].group === lowGroup && v !== null)
    .sort((a,b) => (a[1]-b[1]) || (order.indexOf(a[0]) - order.indexOf(b[0])));
  const groupVals = ranked.map(r => r[1]);
  const overall = A.overall && groupVals.length ? Math.round(groupVals.reduce((x,y)=>x+y,0)/groupVals.length) : null;
  const s = { dims, picks, overall, branch: state.branch, low: ranked[0] && ranked[0][0], next: ranked[1] && ranked[1][0] };
  if (typeof A.profile === "function") s.pattern = A.profile(s);
  else {
    s.pattern = A.patternOrder.reduce((best,k) => picks[k] > picks[best] ? k : best, A.patternOrder[0]);
    /* Tie-break (assessment option `tieBreak: <question index>`): if several patterns share the top count, the pattern picked on that question wins when it is one of them. */
    if (typeof A.tieBreak === "number"){
      const top = Math.max(...Object.values(picks)), tied = Object.keys(picks).filter(k => picks[k] === top);
      const tq = A.questions[A.tieBreak], ta = state.answers[A.tieBreak];
      if (tied.length > 1 && tq && ta !== undefined && tied.includes(tq.opts[ta][1])) s.pattern = tq.opts[ta][1];
    }
    if (A.forcePattern && picks[A.forcePattern.key] >= A.forcePattern.min) s.pattern = A.forcePattern.key;
  }
  return s;
}
function level(v, g, d){
  const t = (d && d.thresholds) || g.thresholds || [65,40];
  const L = (d && d.labels) || g.labels;
  return v >= t[0] ? ["high", L.high] : v >= t[1] ? ["mid", L.mid] : ["low", L.low];
}
const pick = (v, s) => (v && typeof v === "object") ? (v[s.branch] || Object.values(v)[0]) : v;   // branch-keyed text
function actionsFor(s){
  const P = A.patterns[s.pattern], D = A.dimensions;
  const rule = (A.rules||[]).find(r => r.when(s));
  const dimAct = k => ({ why: D[k].why || `Your lowest: ${D[k].label}`, action: pick(D[k].action, s) });
  const acts = [{ why:`Your ${A.patternWord || "pattern"}: ${P.name}`, action:pick(P.action, s) }];
  if (rule) acts.push({ why:rule.why, action:rule.action });
  else if (s.low && D[s.low].action){
    const g = (A.groups||[]).find(x => x.lowestFrom) || (A.groups||[])[0] || {}, strong = s.dims[s.low] >= ((g.thresholds||[65,40])[0]);
    acts.push(Object.assign(dimAct(s.low), { why: strong ? `Keep ${D[s.low].label} strong` : D[s.low].why ? `${D[s.low].label}: ${D[s.low].why}` : `Your biggest leverage point: ${D[s.low].label}` }));
  }
  const nextKey = (rule && rule.dim !== s.low) ? s.low : s.next;
  if (nextKey && D[nextKey].action){ const a = pick(D[nextKey].action, s); if (!acts.some(x => x.action === a)) acts.push({ why:`Next: ${D[nextKey].label}`, action:a }); }
  return acts.filter(a => a.action).slice(0,3);
}
function readableAnswers(){
  return Q().map((q,i) => {
    const a = state.answers[q.i]; let out;
    if (q.type === "scenario" || q.type === "branch") out = a === undefined ? null : q.opts[a][0];
    else if (q.type === "scale") out = a ?? null;
    else { out = {}; Object.entries(a||{}).forEach(([k,v]) => out[A.dimensions[k].label] = v); }
    return { n:i+1, part:q.part||"", question:q.q, answer:out };
  });
}

async function submit(data){
  const s = score();
  const payload = {
    coach: C.coach.slug, assessment: A.id, assessment_title: A.title,
    lead: data,
    pattern: s.pattern, pattern_label: A.patterns[s.pattern].name,
    scores: s.dims, picks: s.picks, lowest: s.low, overall: s.overall, branch: s.branch,
    answers: readableAnswers(),
    actions: actionsFor(s).map(a => a.action),
    meta: { ref: document.referrer || "", src: source().src || "", campaign: source().campaign || "", ua: navigator.userAgent, page: location.href }
  };
  try {
    const r = await fetch("/.netlify/functions/submit", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(payload) });
    if (!r.ok) throw new Error("submit " + r.status);
    const j = await r.json().catch(() => ({})); if (j.id) setLeadId(j.id);
    state.submitted = true; state.pending = null;
  } catch(e) {

    state.pending = payload;
  }
  save();
}

function fileUrl(u){

    : `<div class="r2-hero"><div class="wrap">${first ? `<p class="hello">${esc(first)}, here’s what your answers show.</p>` : ""}<h1>${esc(X.plain || P.headline)}</h1>${chip}</div></div>`;
  app.innerHTML = `
  <div class="r2 lay-${esc(lay)}">
  ${hero}
  <div class="wrap">
    ${quotes.length ? `<section class="r2-said"><p class="k">${esc(RR.toldMe || "You told me")}</p>${quotes.map(q => `<p class="sq">“${esc(q)}”</p>`).join("")}</section>` : ""}
    <section class="r2-real">
      ${lay === "b" && photo ? `<div class="r2-float">${kimg(photo, "", "Kayla Bundy")}</div>` : ""}
      <p class="k">${esc(RR.realLabel || "")}</p>
      <p class="rt">${esc(X.real || P.means)}</p>
    </section>
  </div>
  <div class="r2-fit"><div class="wrap">
    <h2>${esc((RR.fitHeading || "").replace("{name}", first ? ", " + first : ""))}</h2>
    <p class="fl">${esc(RR.fitLead || "")}</p>
    <div class="rows">${(X.fit || []).map(([a,b]) => `<div class="row"><p class="pa">${esc(a)}</p><p class="fx">${esc(b)}</p></div>`).join("")}</div>
    ${btn("pulse")}
    <p class="cap">${esc(RR.capLine || "")}</p>
  </div></div>
  <div class="wrap">
    ${X.today ? `<section class="r2-today"><p class="k">${esc(RR.todayLabel || "")}</p><p>${esc(X.today)}</p></section>` : ""}
    ${proof.length ? `<section class="r2-proof">${proof.map(([q,c]) => `<figure><blockquote>“${esc(q)}”</blockquote><figcaption>${esc(c)}</figcaption></figure>`).join("")}<p class="pn">${esc(PH.proof.note || "")}</p></section>` : ""}
    <div class="r2-again">${btn("")}</div>
    <section class="r2-later">
      <p class="k">${esc(RR.laterLabel || "")}</p>
      <p>${esc(RR.laterBody || "")} <span class="gs">Start with ${esc(P.guideStart)}.</span></p>
      ${pdf ? `<a class="btn ghost" href="${esc(pdf)}" target="_blank" rel="noopener">${esc(R.pdfButton)}</a>` : ""}
      ${nr.text && live(nr.url) ? `<p class="notready"><a href="${esc(nr.url)}" target="_blank" rel="noopener">${esc(nr.text.replace(/^Not ready\?\s*/i, "").replace(/^./, c => c.toUpperCase()))}</a></p>` : ""}
      ${(() => { const M = C.moreLinks; if (!M) return ""; const used = [cta.url, nr.url]; const items = (M.items||[]).filter(x => live(x.url) && !used.includes(x.url)); return items.length ? `<p class="more">${esc(M.label)} ${items.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`).join(" · ")}</p>` : ""; })()}
      <div class="tools"><button class="btn ghost" id="copy">Copy my result</button><button class="btn ghost" id="again">Retake</button></div>
    </section>
    <p class="care">${esc(R.care)}</p>
  </div>
  </div>`;
  motion();
  T.step("results_view", { r: s.pattern, src: source().src || "", lay }, true);
  [["#copy","copy_result"],["#again","retake"]].forEach(([sel,e]) => { const b = app.querySelector(sel); if (b) b.setAttribute("data-track", e); });
  app.querySelectorAll(".r2-later a.btn").forEach(a => a.setAttribute("data-track", "guide_click"));
  app.querySelectorAll(".r2-fit a.btn").forEach(a => a.setAttribute("data-track", "cta_click"));
  app.querySelectorAll(".r2-fit a.btn, .r2-again a.btn").forEach(a => a.addEventListener("click", () => markLead("results_click")));
  app.querySelectorAll(".r2-again a.btn").forEach(a => { a.setAttribute("data-track", "cta_click"); a.setAttribute("data-track-k", "second"); });
  app.querySelectorAll(".notready a").forEach(a => a.setAttribute("data-track", "notready_click"));
  app.querySelectorAll(".more a").forEach((a,k) => { a.setAttribute("data-track", "more_click"); a.setAttribute("data-track-k", k ? "bundle" : "ebook"); });
  const fit = app.querySelector(".r2-fit"); if (fit) fit.setAttribute("data-track-seen", "fit_view");
  const lt = app.querySelector(".r2-later"); if (lt) lt.setAttribute("data-track-seen", "later_view");
  T.scan(app);
  document.getElementById("again").onclick = () => { state = { step:0, answers:{}, submitted:false, branch:null, order:null }; save(); render(); };
  document.getElementById("copy").onclick = async () => {
    const text = `My ${A.title} result: ${X.plain || P.headline}\n\n${RR.todayLabel || "Do this today"}: ${X.today || P.week}`;
    try { await navigator.clipboard.writeText(text); toast("Result copied"); }
    catch(e){ toast("Copy not available here"); }
  };
}
function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1800); }

load(); render();
</script>
</body>
</html>
